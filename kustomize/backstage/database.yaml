apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: backstage
  namespace: cnpg-backstage
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18

  storage:
    size: 8Gi

  # CPU 150m estava a estrangular o Postgres (throttling ~2.6 períodos/s no
  # dashboard) mesmo com uso médio de ~30m — bursts de query batiam no teto.
  # request == limit mantém QoS Guaranteed; o nó (rasp-worker-3) tem folga.
  resources:
    requests:
      cpu: "500m"
      memory: "384Mi"
    limits:
      cpu: "500m"
      memory: "384Mi"

  bootstrap:
    initdb:
      database: backstagedb
      owner: backstageuser
      postInitSQL:
        - "ALTER ROLE backstageuser CREATEDB;"

  postgresql:
    parameters:
      max_connections: "30"
      shared_buffers: "64MB"
  
  monitoring:
    enablePodMonitor: true